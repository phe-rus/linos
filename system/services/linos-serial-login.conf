[Service]
# Local serial console only. tty1 remains the conventional PAM/getty rescue login.
# No username or password is ever passed to the service command line.
ExecStart=
ExecStart=-/sbin/agetty --noissue --skip-login --login-program /usr/lib/linos/linos-login --keep-baud 115200,38400,9600 %I $TERM
