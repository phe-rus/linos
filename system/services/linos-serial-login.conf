[Service]
# Linos owns the interactive login presentation on local consoles.
# PAM remains responsible for all password authentication through login(1).
# Rescue fallback is built into linos-login if its terminal UI cannot start.
ExecStart=
ExecStart=-/sbin/agetty --noissue --skip-login --login-program /usr/lib/linos/linos-login --keep-baud 115200,38400,9600 %I $TERM
