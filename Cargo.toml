[package]
name = "linos"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.191"
rustix = { version = "1.1.5", features = ["fs", "process"] }
cliclack = "0.5.7"

[[bin]]
name = "linos"
path = "system/src/console/main.rs"

[[bin]]
name = "detect"
path = "system/src/hardware.rs"

[[bin]]
name = "enroll"
path = "system/src/setup/main.rs"

[[bin]]
name = "linos-login"
path = "system/src/login.rs"

[[bin]]
name = "recovery"
path = "system/src/recovery/main.rs"

[[bin]]
name = "init"
path = "system/src/init.rs"

[[bin]]
name = "linos-graphics"
path = "system/src/graphics/main.rs"
