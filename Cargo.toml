[package]
name = "linos"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "system/src/lib.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.191"
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
cliclack = "0.5.7"

[[bin]]
name = "linos"
path = "system/src/console/main.rs"

[[bin]]
name = "detect"
path = "system/src/hardware.rs"

[[bin]]
name = "enroll"
path = "system/src/setup/main.rs"

[[bin]]
name = "linos-login"
path = "system/src/login.rs"

[[bin]]
name = "recovery"
path = "system/src/recovery/main.rs"

[[bin]]
name = "linos-layout2"
path = "system/src/layout2.rs"

[[bin]]
name = "linos-update-image"
path = "system/src/update_image.rs"

[[bin]]
name = "linos-update-health"
path = "system/src/update_health.rs"

[[bin]]
name = "init"
path = "system/src/init.rs"

[[bin]]
name = "linos-graphics"
path = "system/src/graphics/main.rs"

# Development builds prioritize low RAM usage and fast feedback on
# Chromebooks, small ARM boards and modest CI runners.
[profile.dev]
debug = 0
codegen-units = 16
incremental = true

[profile.test]
debug = 0
codegen-units = 16
incremental = true

# Release builds optimize without expensive whole-program LTO.
# We can introduce measured per-binary LTO only when the gain warrants it.
[profile.release]
opt-level = 2
lto = false
codegen-units = 8
debug = 0
strip = "debuginfo"
incremental = false
panic = "abort"

[dev-dependencies]
vt100 = "0.18.1"
