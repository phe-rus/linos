name: Linos Kernel Release

# Explicit commit markers: kernel:validate runs lightweight Rust tests, kernel:build compiles Linux, kernel:integration reuses qualified binaries, kernel:release publishes after all tests.
# Kernel build-only runs never create GitHub tags or releases.
on:
  # Manual qualification only reuses existing kernels. It never publishes.
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Qualified kernel run, empty uses kernel/candidate.conf"
        type: string
      source_sha:
        description: "Kernel source SHA, required with source_run_id"
        type: string
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'build/kernel.sh'
      - 'build/kernel-package.sh'
      - '.github/workflows/kernel*.yml'
      - 'system/src/**'
      - 'system/identity/**'
      - 'system/services/**'
      - 'build/package.sh'
      - 'build/image.sh'
      - 'build/candidate.sh'
      - 'build/fetch-artifact.sh'
      - 'tests/server.sh'
      - 'tests/candidate.sh'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1
  LINOS_QEMU_MEMORY: 1024
  LINOS_QEMU_CPUS: 1
  TMPDIR: /var/tmp

jobs:
  validate:
    # Lightweight Rust checks requested by the explicit kernel:validate
    # marker. No Linux source download, kernel compile, QEMU, or OS images.
    if: ${{ contains(github.event.head_commit.message, 'kernel:validate') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Install storage fixture tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdisk e2fsprogs util-linux openssl
      - name: Validate Rust kernel tooling, initialization and recovery contracts
        run: |
          bash tests/candidate.sh
          bash tests/layout-v2.sh
          cargo test --locked --manifest-path kernel/tools/Cargo.toml
          cargo test --locked --bin init
          cargo test --locked --lib --bin recovery --bin linos-update-image --bin linos-update-health --test update_image

  build:
    # Only a requested kernel build enters the concurrency queue.
    # Regular kernel commits skip immediately without blocking the workflow.
    concurrency:
      group: linos-kernel-build-main
      cancel-in-progress: false
    # An exact, deliberate commit-message marker gates expensive work.
    # A push without this marker has no build/boot/release jobs.
    if: ${{ contains(github.event.head_commit.message, 'kernel:build') || contains(github.event.head_commit.message, 'kernel:release') }}
    uses: ./.github/workflows/kernel-build.yml
    permissions:
      contents: read

  boot:
    needs: build
    uses: ./.github/workflows/kernel-boot.yml
    permissions:
      contents: read
      actions: read

  kernel-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'kernel:integration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Select explicit kernel candidate
        id: select
        env:
          REQUESTED_RUN: ${{ inputs.source_run_id }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          source kernel/candidate.conf
          if [[ -n "$REQUESTED_RUN" || -n "$REQUESTED_SHA" ]]; then
            LINOS_KERNEL_RUN_ID="$REQUESTED_RUN"
            LINOS_KERNEL_SOURCE_SHA="$REQUESTED_SHA"
          fi
          [[ "$LINOS_KERNEL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$LINOS_KERNEL_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "run_id=$LINOS_KERNEL_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$LINOS_KERNEL_SOURCE_SHA" >> "$GITHUB_OUTPUT"

  # Userspace qualification reuses verified packages, never builds Linux.
  integration-check:
    needs: kernel-candidate
    concurrency:
      group: linos-native-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'kernel:integration') }}
    uses: ./.github/workflows/kernel-integration.yml
    with:
      source_run_id: ${{ fromJSON(needs.kernel-candidate.outputs.run_id) }}
      source_sha: ${{ needs.kernel-candidate.outputs.source_sha }}
    permissions:
      contents: read
      actions: read

  integration:
    concurrency:
      group: linos-native-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ contains(github.event.head_commit.message, 'kernel:release') }}
    needs: boot
    uses: ./.github/workflows/kernel-integration.yml
    permissions:
      contents: read
      actions: read

  publish:
    if: ${{ contains(github.event.head_commit.message, 'kernel:release') }}
    needs: integration
    uses: ./.github/workflows/kernel-publish.yml
    permissions:
      contents: write
      actions: read
