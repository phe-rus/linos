name: Linos Kernel Release

# Explicit commit markers: kernel:build tests, kernel:integration reuses qualified binaries, kernel:release publishes after all tests.
# Kernel build-only runs never create GitHub tags or releases.
on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'build/kernel.sh'
      - 'build/kernel-package.sh'
      - '.github/workflows/kernel*.yml'

permissions:
  contents: read

jobs:
  build:
    # Only a requested kernel build enters the concurrency queue.
    # Regular kernel commits skip immediately without blocking the workflow.
    concurrency:
      group: linos-kernel-build-main
      cancel-in-progress: false
    # An exact, deliberate commit-message marker gates expensive work.
    # A push without this marker has no build/boot/release jobs.
    if: ${{ contains(github.event.head_commit.message, 'kernel:build') || contains(github.event.head_commit.message, 'kernel:release') }}
    uses: ./.github/workflows/kernel-build.yml
    permissions:
      contents: read

  boot:
    needs: build
    uses: ./.github/workflows/kernel-boot.yml
    permissions:
      contents: read
      actions: read

  # Reuse already verified packages instead of compiling them again.
  # Pinned to successful AMD64+ARM64 QEMU qualification 44213747067.
  integration-check:
    if: ${{ contains(github.event.head_commit.message, 'kernel:integration') }}
    uses: ./.github/workflows/kernel-integration.yml
    with:
      source_run_id: 44213747067
    permissions:
      contents: read
      actions: read

  integration:
    if: ${{ contains(github.event.head_commit.message, 'kernel:release') }}
    needs: boot
    uses: ./.github/workflows/kernel-integration.yml
    permissions:
      contents: read
      actions: read

  publish:
    if: ${{ contains(github.event.head_commit.message, 'kernel:release') }}
    needs: integration
    uses: ./.github/workflows/kernel-publish.yml
    permissions:
      contents: write
      actions: read
