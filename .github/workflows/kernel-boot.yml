name: Linos Kernel · Boot Test

# Reusable test only: boot exactly the .deb from the build workflow.
# It never clones or compiles Linux.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  qemu:
    name: QEMU ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            package: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            package: qemu-system-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: linos-kernel-${{ matrix.arch }}
          path: kernel-package
      - name: Install QEMU and initramfs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.package }} cpio busybox-static
      - name: Verify package and boot it
        shell: bash
        run: |
          set -Eeuo pipefail
          source kernel/source.conf
          deb="kernel-package/linos-kernel_${LINOS_KERNEL_VERSION}_${{ matrix.arch }}.deb"
          test -s "$deb"
          (cd kernel-package && sha256sum -c SHA256SUMS)
          test "$(dpkg-deb -f "$deb" Package)" = linos-kernel
          test "$(dpkg-deb -f "$deb" Version)" = "$LINOS_KERNEL_VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.arch }}"
          mkdir -p extracted
          dpkg-deb -x "$deb" extracted
          release="$(cat kernel-package/kernel-release)"
          test "$release" = "$(basename "$(find extracted/boot -name 'vmlinuz-*-linos' -print -quit)" | sed 's/^vmlinuz-//')"
          image="extracted/boot/vmlinuz-$release"
          test -s "$image"
          # Verify the actual distributed config, not just the build input.
          config="extracted/boot/config-$release"
          test -s "$config"
          for setting in \
            CONFIG_LINOS_BOOT_STATE=y \
            CONFIG_PSI=y \
            CONFIG_PREEMPT_DYNAMIC=y \
            CONFIG_SECCOMP_FILTER=y \
            CONFIG_PSTORE=y \
            CONFIG_DM_VERITY=y; do
            grep -Fxq "$setting" "$config" || {
              echo "Distributed Linos kernel missing $setting" >&2
              exit 1
            }
          done

          root="$RUNNER_TEMP/initramfs"
          mkdir -p "$root"/{bin,dev,proc,sys}
          sudo mknod -m 600 "$root/dev/console" c 5 1
          sudo mknod -m 666 "$root/dev/null" c 1 3
          cp /bin/busybox "$root/bin/busybox"
          ln -s busybox "$root/bin/sh"
          cat > "$root/init" <<'INIT'
          #!/bin/sh
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sysfs /sys
          state=/sys/kernel/linos/boot_state
          test "$(/bin/busybox cat "$state")" = starting || exit 41
          test -r /proc/pressure/memory || exit 44
          test -r /proc/pressure/cpu || exit 45
          if echo invalid > "$state"; then
            echo "ERROR: kernel accepted invalid boot state"
            exit 46
          fi
          test "$(/bin/busybox cat "$state")" = starting || exit 47
          echo ready > "$state" || exit 42
          test "$(/bin/busybox cat "$state")" = ready || exit 43
          echo LINOS_BOOT_STATE_OK
          echo LINOS_KERNEL_BOOT_OK
          /bin/busybox poweroff -f
          INIT
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -o --format=newc --quiet | gzip -9) > "$RUNNER_TEMP/initramfs.gz"
          if [[ "${{ matrix.arch }}" == amd64 ]]; then
            qemu=(qemu-system-x86_64 -machine q35,accel=tcg -cpu qemu64)
            console=ttyS0
          else
            qemu=(qemu-system-aarch64 -machine virt -cpu cortex-a76)
            console=ttyAMA0
          fi
          timeout --signal=TERM --kill-after=5s 120s \
            "${qemu[@]}" -kernel "$image" -initrd "$RUNNER_TEMP/initramfs.gz" \
            -append "console=$console rdinit=/init loglevel=4" \
            -smp 2 -m 1024 -display none -monitor none -serial stdio \
            -no-reboot -net none >"$RUNNER_TEMP/qemu.log" 2>&1 || true
          grep -Fq LINOS_BOOT_STATE_OK "$RUNNER_TEMP/qemu.log" || {
            tail -n 100 "$RUNNER_TEMP/qemu.log"
            exit 1
          }
          grep -Fq LINOS_KERNEL_BOOT_OK "$RUNNER_TEMP/qemu.log" || {
            tail -n 120 "$RUNNER_TEMP/qemu.log"
            exit 1
          }
          echo "PASS: packaged Linos kernel $release boots in QEMU"
      - name: Upload boot log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-boot-failure-${{ matrix.arch }}
          path: ${{ runner.temp }}/qemu.log
          if-no-files-found: ignore
          retention-days: 7
