name: Linos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    name: ${{ matrix.arch }} · Rust, image, QEMU
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_package: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_package: qemu-system-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt clippy

      - name: Rust formatting, linting and tests
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked

      - name: Validate shell scripts
        run: |
          for file in build/*.sh; do bash -n "$file"; done

      - name: Install image-building dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates \
            ${{ matrix.qemu_package }}

      - name: Build Linos package and server image
        run: |
          ./build/package.sh
          ./build/image.sh

      - name: Boot smoke test
        run: ./build/smoke.sh ${{ matrix.arch }}

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.arch }}
          path: |
            images/server/builds/**/smoke.log
            images/server/builds/**/qemu.log
          if-no-files-found: ignore
          retention-days: 7
