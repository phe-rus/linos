name: Linos CI

# Full OS images, QEMU boots and installation tests are expensive.
# Run on demand rather than for every commit or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual runs on the same ref replace older unfinished manual runs.
  group: linos-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  LINOS_QEMU_MEMORY: 1024
  LINOS_QEMU_CPUS: 1
  TMPDIR: /var/tmp

jobs:
  build-and-boot:
    name: ${{ matrix.arch }} · Rust, image, QEMU
    runs-on: ${{ matrix.runner }}
    # Compatibility images are tested separately; product image boots require
    # the verified Linos kernel and cannot use this escape hatch by default.
    env:
      LINOS_ALLOW_COMPAT: '1'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_package: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_package: qemu-system-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install native graphics runtime for linker checks
        run: sudo apt-get update && sudo apt-get install -y libx11-6

      - name: Rust formatting, linting and tests
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked

      - name: Validate shell scripts
        run: |
          for file in build/*.sh tests/*.sh; do bash -n "$file"; done
          bash tests/candidate.sh

      - name: Install image-building dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates gnupg curl expect fakeroot \
            ${{ matrix.qemu_package }}

      - name: Install verified Debian 13 archive keys
        run: |
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build Linos package and server image
        run: |
          ./build/package.sh
          LINOS_KERNEL_MODE=compat ./build/image.sh

      - name: Capture immutable development candidate before guest tests
        run: |
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          bash build/candidate.sh pack "images/server/builds/${{ matrix.arch }}/$build_id" ${{ matrix.arch }} target/candidate
      - name: Retain development candidate even when later gates fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-candidate-${{ matrix.arch }}
          path: target/candidate/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Install OS vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      - name: Scan built OS package vulnerabilities
        id: os_scan
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          scan_root="$RUNNER_TEMP/linos-security-rootfs"
          mkdir -p "$scan_root" security-results
          cp target/candidate/candidate.tar.gz.sha256 security-results/
          cp "$(find images/server/builds -name candidate-manifest -print -quit)" security-results/
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          tar --extract --file="images/server/builds/${{ matrix.arch }}/$build_id/rootfs.tar" \
            --directory="$scan_root" --no-same-owner \
            --exclude='./dev/*' --exclude='./proc/*' --exclude='./sys/*' --exclude='./run/*'
          scan_status=0
          trivy rootfs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output security-results/os-vulnerabilities.json "$scan_root" || scan_status=$?
          trivy --version --format json > security-results/scanner.json
          exit "$scan_status"

      - name: Boot smoke test
        run: ./tests/server.sh smoke ${{ matrix.arch }}

      - name: Verify device identity across two persistent boots
        run: ./tests/server.sh persistence ${{ matrix.arch }}

      - name: Exercise interrupted and completed console enrollment
        run: ./tests/enrollment.sh ${{ matrix.arch }}

      - name: Install AMD64 UEFI build and firmware dependencies
        if: matrix.arch == 'amd64'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gdisk dosfstools mtools systemd-boot-efi ovmf

      - name: Build and firmware-boot AMD64 GPT image
        if: matrix.arch == 'amd64'
        run: |
          ./build/media.sh amd64
          ./tests/boot.sh uefi

      - name: Build offline Server installation payload
        if: matrix.arch == 'amd64'
        run: ./build/recovery.sh payload amd64

      - name: Simulate installation and firmware boot on disposable GPT disk
        if: matrix.arch == 'amd64'
        run: ./tests/installation.sh simulation

      - name: Keep OS vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: os-security-${{ matrix.arch }}
          path: security-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce OS vulnerability gate after functional checks
        if: ${{ always() && steps.os_scan.outcome == 'failure' }}
        run: |
          echo "OS vulnerability scan found blocking issues or could not complete; inspect its report."
          exit 1

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.arch }}
          path: |
            images/server/builds/**/smoke.log
            images/server/builds/**/qemu.log
            images/server/builds/**/boot-*.log
            images/server/builds/**/fsck-*.log
            images/server/builds/**/debugfs.log
            images/server/builds/**/enrollment-*.log
            images/server/builds/**/uefi-*.log
            images/recovery/builds/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  recovery-uefi:
    needs: build-and-boot
    # The optional kernel job can be skipped without suppressing recovery CI.
    if: ${{ always() && needs.build-and-boot.result == 'success' }}
    name: amd64 · Recovery image, OVMF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check recovery crate
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy -p linos --lib --bin recovery --bin linos-update-image --bin linos-update-health --test update_image --locked -- -D warnings
          cargo +stable test -p linos --lib --bin recovery --bin linos-update-image --bin linos-update-health --test update_image --locked

      - name: Install recovery-build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates gnupg curl fakeroot \
            gdisk dosfstools mtools systemd-boot-efi ovmf qemu-system-x86

      - name: Validate disposable GPT Server layout
        run: ./tests/installation.sh layout

      - name: Install verified Debian 13 archive keys
        run: |
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build independent recovery image
        run: ./build/recovery.sh image amd64

      - name: Boot Recovery through OVMF
        run: ./tests/boot.sh recovery

      - name: Upload recovery diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-boot-logs
          path: images/recovery/builds/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  installer-media:
    needs: [build-and-boot, recovery-uefi]
    if: ${{ always() && needs.recovery-uefi.result == 'success' }}
    name: amd64 · Offline installer media
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check recovery and installer scripts
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked
          for file in build/*.sh tests/*.sh; do bash -n "$file"; done

      - name: Install build, GPT, and firmware dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates gnupg curl fakeroot \
            gdisk dosfstools mtools systemd-boot-efi ovmf qemu-system-x86

      - name: Install verified Debian 13 archive keys
        run: |
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Download original Server candidate
        uses: actions/download-artifact@v7
        with:
          name: server-candidate-amd64
          path: target/candidate
      - name: Verify original Server candidate and build its offline payload
        run: |
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          bash build/candidate.sh restore target/candidate amd64 "$GITHUB_SHA" "images/server/builds/amd64/$build_id"
          ./build/recovery.sh payload amd64

      - name: Qualify signed image updates and firmware fallback
        run: ./tests/update.sh

      - name: Sign payload with disposable CI-only Ed25519 key
        run: |
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/linos-ci-test-private.pem"
          openssl pkey -in "$RUNNER_TEMP/linos-ci-test-private.pem" -pubout \
            -out "$RUNNER_TEMP/linos-ci-test-public.pem"
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          payload="images/install/payloads/amd64/$build_id"
          LINOS_PAYLOAD_SIGNING_KEY="$RUNNER_TEMP/linos-ci-test-private.pem" \
            ./build/recovery.sh sign "$payload"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/linos-ci-test-public.pem" \
            -in "$payload/SHA256SUMS" -sigfile "$payload/SHA256SUMS.sig"
          # A one-byte mutation must be rejected without touching the original payload.
          cp "$payload/SHA256SUMS" "$RUNNER_TEMP/tampered-sums"
          printf 'x' >> "$RUNNER_TEMP/tampered-sums"
          if openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/linos-ci-test-public.pem" \
            -in "$RUNNER_TEMP/tampered-sums" -sigfile "$payload/SHA256SUMS.sig"; then
            echo "ERROR: altered payload signature unexpectedly verified" >&2
            exit 1
          fi
          echo "LINOS_TRUSTED_PAYLOAD_KEY=$RUNNER_TEMP/linos-ci-test-public.pem" >> "$GITHUB_ENV"

      - name: Embed offline payload into independent Recovery
        run: |
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          LINOS_INSTALL_PAYLOAD_DIR="images/install/payloads/amd64/$build_id" ./build/recovery.sh image amd64
          cp "images/server/builds/amd64/$build_id/candidate-manifest" "images/recovery/builds/amd64/$build_id/server-candidate-manifest"
          disk="images/recovery/builds/amd64/$build_id/disk.ext4"
          debugfs -R 'cat /usr/share/linos/install/manifest' "$disk" 2>/dev/null \
            | grep -qx 'edition=server'
          debugfs -R 'stat /usr/share/linos/install/SHA256SUMS.sig' "$disk" 2>/dev/null \
            | grep -q 'Size: 64'
          debugfs -R 'cat /usr/share/linos/install/signing-public.pem' "$disk" 2>/dev/null \
            | grep -q 'BEGIN PUBLIC KEY'

      - name: Boot recovery media with offline payload
        run: ./tests/boot.sh recovery

      - name: Upload installer-media diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-media-logs
          path: |
            images/recovery/builds/**/*.log
            target/update-test-logs/**/*.log
          if-no-files-found: ignore
          retention-days: 7
