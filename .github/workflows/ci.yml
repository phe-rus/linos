name: Linos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    name: ${{ matrix.arch }} · Rust, image, QEMU
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_package: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_package: qemu-system-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Rust formatting, linting and tests
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked

      - name: Validate shell scripts
        run: |
          for file in build/*.sh; do bash -n "$file"; done

      - name: Install image-building dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates gnupg curl expect fakeroot \
            ${{ matrix.qemu_package }}

      - name: Install verified Debian 13 archive keys
        run: |
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build Linos package and server image
        run: |
          ./build/package.sh
          ./build/image.sh

      - name: Boot smoke test
        run: ./build/smoke.sh ${{ matrix.arch }}

      - name: Verify device identity across two persistent boots
        run: ./build/persistence.sh ${{ matrix.arch }}

      - name: Exercise interrupted and completed console enrollment
        run: ./build/enrollment.sh ${{ matrix.arch }}

      - name: Install AMD64 UEFI build and firmware dependencies
        if: matrix.arch == 'amd64'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gdisk dosfstools mtools systemd-boot-efi ovmf

      - name: Build and firmware-boot AMD64 GPT image
        if: matrix.arch == 'amd64'
        run: |
          ./build/uefi.sh amd64
          ./build/uefi-smoke.sh

      - name: Build offline Server installation payload
        if: matrix.arch == 'amd64'
        run: ./build/payload.sh amd64

      - name: Simulate installation and firmware boot on disposable GPT disk
        if: matrix.arch == 'amd64'
        run: ./build/install-simulation.sh

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs-${{ matrix.arch }}
          path: |
            images/server/builds/**/smoke.log
            images/server/builds/**/qemu.log
            images/server/builds/**/boot-*.log
            images/server/builds/**/fsck-*.log
            images/server/builds/**/debugfs.log
            images/server/builds/**/enrollment-*.log
            images/server/builds/**/uefi-*.log
            images/recovery/builds/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  recovery-uefi:
    name: amd64 · Recovery image, OVMF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check recovery crate
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy -p recovery --all-targets --locked -- -D warnings
          cargo +stable test -p recovery --locked

      - name: Install recovery-build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates gnupg curl fakeroot \
            gdisk dosfstools mtools systemd-boot-efi ovmf qemu-system-x86

      - name: Validate disposable GPT Server layout
        run: ./build/layout-test.sh

      - name: Install verified Debian 13 archive keys
        run: |
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build independent recovery image
        run: ./build/recovery-image.sh amd64

      - name: Boot Recovery through OVMF
        run: ./build/recovery-smoke.sh

      - name: Upload recovery diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-boot-logs
          path: images/recovery/builds/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  installer-media:
    name: amd64 · Offline installer media
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check recovery and installer scripts
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked
          for file in build/*.sh; do bash -n "$file"; done

      - name: Install build, GPT, and firmware dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates gnupg curl fakeroot \
            gdisk dosfstools mtools systemd-boot-efi ovmf qemu-system-x86

      - name: Install verified Debian 13 archive keys
        run: |
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build offline Server payload
        run: |
          ./build/package.sh
          ./build/image.sh
          ./build/payload.sh amd64

      - name: Sign payload with disposable CI-only Ed25519 key
        run: |
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/linos-ci-test-private.pem"
          openssl pkey -in "$RUNNER_TEMP/linos-ci-test-private.pem" -pubout \
            -out "$RUNNER_TEMP/linos-ci-test-public.pem"
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' packages/release/usr/lib/linos/release)"
          payload="images/install/payloads/amd64/$build_id"
          LINOS_PAYLOAD_SIGNING_KEY="$RUNNER_TEMP/linos-ci-test-private.pem" \
            ./build/sign-payload.sh "$payload"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/linos-ci-test-public.pem" \
            -in "$payload/SHA256SUMS" -sigfile "$payload/SHA256SUMS.sig"
          echo "LINOS_TRUSTED_PAYLOAD_KEY=$RUNNER_TEMP/linos-ci-test-public.pem" >> "$GITHUB_ENV"

      - name: Embed offline payload into independent Recovery
        run: |
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' packages/release/usr/lib/linos/release)"
          LINOS_INSTALL_PAYLOAD_DIR="images/install/payloads/amd64/$build_id" ./build/recovery-image.sh amd64
          disk="images/recovery/builds/amd64/$build_id/disk.ext4"
          debugfs -R 'cat /usr/share/linos/install/manifest' "$disk" 2>/dev/null \
            | grep -qx 'edition=server'
          debugfs -R 'stat /usr/share/linos/install/SHA256SUMS.sig' "$disk" 2>/dev/null \
            | grep -q 'Size: 64'
          debugfs -R 'cat /usr/share/linos/install/signing-public.pem' "$disk" 2>/dev/null \
            | grep -q 'BEGIN PUBLIC KEY'

      - name: Boot recovery media with offline payload
        run: ./build/recovery-smoke.sh

      - name: Upload installer-media diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-media-logs
          path: images/recovery/builds/**/*.log
          if-no-files-found: ignore
          retention-days: 7
