name: Linos Kernel · Installed OS Boot

# Native candidate qualification. Reuses compiled kernel .deb, never compiles Linux.
on:
  workflow_call:
    inputs:
      source_run_id:
        description: "Successful kernel qualification run to reuse, or zero for this run"
        required: false
        type: number
        default: 0
      source_sha:
        description: "Expected source SHA of the reused kernel run"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_JOBS: 1
  LINOS_QEMU_MEMORY: 1024
  LINOS_QEMU_CPUS: 1
  TMPDIR: /var/tmp

jobs:
  installed-boot:
    name: Linos 13 installed kernel ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_package: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_package: qemu-system-arm
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and verify reused kernel identity
        if: inputs.source_run_id != 0
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN: ${{ inputs.source_run_id }}
          KERNEL_SHA: ${{ inputs.source_sha }}
          ARCH: ${{ matrix.arch }}
        run: bash build/fetch-artifact.sh "$KERNEL_RUN" "$KERNEL_SHA" "linos-kernel-$ARCH" kernel-package kernel
      - uses: actions/download-artifact@v7
        if: inputs.source_run_id == 0
        with:
          name: linos-kernel-${{ matrix.arch }}
          path: kernel-package
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check Linos 13 Rust userspace before image construction
        run: |
          cargo test --locked --bin init
          cargo check --locked --bins
      - name: Install OS image dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mmdebstrap dpkg-dev e2fsprogs qemu-utils ca-certificates \
            gnupg curl expect fakeroot ${{ matrix.qemu_package }}
      - name: Install AMD64 firmware qualification dependencies
        if: matrix.arch == 'amd64'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gdisk dosfstools mtools systemd-boot-efi ovmf
      - name: Install a stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Verify Debian 13 archive keys
        shell: bash
        run: |
          set -Eeuo pipefail
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"
      - name: Assemble Linos 13 with the exact qualified kernel package
        shell: bash
        run: |
          set -Eeuo pipefail
          source kernel/source.conf
          arch="${{ matrix.arch }}"
          package="$GITHUB_WORKSPACE/kernel-package/linos-kernel_${LINOS_KERNEL_VERSION}_${arch}.deb"
          test -s "$package"
          (cd kernel-package && sha256sum -c SHA256SUMS)
          # This check runs against the pinned, previously qualified package.
          # It does not compile Linux again.
          test "$(dpkg-deb -f "$package" Version)" = "$LINOS_KERNEL_VERSION"
          test "$(dpkg-deb -f "$package" Architecture)" = "$arch"
          # Match recorded overlays, source version and build script to this
          # exact checkout before spending time on a full Linos OS image.
          test -s kernel-package/provenance.txt
          cargo run --quiet --locked --manifest-path kernel/tools/Cargo.toml -- \
            verify-provenance . kernel-package/provenance.txt "$arch"
          dpkg-deb --fsys-tarfile "$package" |
            tar -xOf - ./usr/share/doc/linos-kernel/provenance.txt |
            cmp - kernel-package/provenance.txt
          ./build/package.sh
          LINOS_ARCH="$arch" LINOS_KERNEL_MODE=linos LINOS_KERNEL_PACKAGE="$package" \
            bash build/image.sh
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          image="images/server/builds/$arch/$build_id"
          test -s "$image/kernel-manifest"
          grep -Fxq mode=linos "$image/kernel-manifest"
          grep -Eq '^release=[^[:space:]]+-linos$' "$image/kernel-manifest"
          test -s "$image/boot/kernel"
          test -s "$image/boot/initramfs"
      - name: Capture immutable development candidate before guest tests
        env:
          LINOS_KERNEL_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          LINOS_KERNEL_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          source kernel/source.conf
          export LINOS_KERNEL_PACKAGE="$GITHUB_WORKSPACE/kernel-package/linos-kernel_${LINOS_KERNEL_VERSION}_${{ matrix.arch }}.deb"
          export LINOS_KERNEL_PROVENANCE="$GITHUB_WORKSPACE/kernel-package/provenance.txt"
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          bash build/candidate.sh pack "images/server/builds/${{ matrix.arch }}/$build_id" ${{ matrix.arch }} target/candidate
      - name: Retain development candidate even when later gates fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-candidate-${{ matrix.arch }}
          path: target/candidate/
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 14
      - name: Install native image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan native Server OS package vulnerabilities
        id: os_scan
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          scan_root="$RUNNER_TEMP/linos-native-security-rootfs"
          mkdir -p "$scan_root" security-results
          cp target/candidate/candidate.tar.gz.sha256 security-results/
          cp "$(find images/server/builds -name candidate-manifest -print -quit)" security-results/
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          tar --extract --file="images/server/builds/${{ matrix.arch }}/$build_id/rootfs.tar" \
            --directory="$scan_root" --no-same-owner \
            --exclude='./dev/*' --exclude='./proc/*' --exclude='./sys/*' --exclude='./run/*'
          scan_status=0
          trivy rootfs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output security-results/native-os-vulnerabilities.json "$scan_root" || scan_status=$?
          trivy --version --format json > security-results/scanner.json
          exit "$scan_status"
      - name: Boot Linos 13 Server under QEMU
        run: bash tests/server.sh smoke ${{ matrix.arch }}
      - name: Verify disk recovery and persistent Linos identity across two boots
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/server.sh persistence ${{ matrix.arch }}
      - name: Qualify enrollment, firmware boot and managed update health
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -Eeuo pipefail
          # mmdebstrap's unshared user cannot traverse GitHub's private _temp.
          # /var/tmp is traversable and disk backed, including for large images.
          export TMPDIR=/var/tmp
          export LINOS_QEMU_MEMORY=1024
          export LINOS_QEMU_CPUS=1
          LINOS_KEEP_ENROLL_TEST=1 bash tests/enrollment.sh amd64 | tee "$RUNNER_TEMP/enrollment-result.txt"
          fixture="$(sed -n 's/^Enrollment test artifacts: //p' "$RUNNER_TEMP/enrollment-result.txt")"
          test -s "$fixture/disk.ext4"
          trap 'rm -r -- "$fixture"' EXIT
          bash build/media.sh amd64
          bash tests/boot.sh uefi
          LINOS_UPDATE_ENROLLED_DISK="$fixture/disk.ext4" bash tests/update.sh
          source kernel/source.conf
          LINOS_KERNEL_PACKAGE="$GITHUB_WORKSPACE/kernel-package/linos-kernel_${LINOS_KERNEL_VERSION}_amd64.deb" \
            bash build/recovery.sh image amd64
          bash tests/boot.sh recovery
      - name: Preserve native OS vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-os-security-${{ matrix.arch }}
          path: security-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce native OS vulnerability gate after functional checks
        if: ${{ always() && steps.os_scan.outcome == 'failure' }}
        run: |
          echo "Native Server OS vulnerability scan found blocking issues or could not complete; inspect its report."
          exit 1
      - name: Preserve installed kernel qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-installed-boot-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/enrollment-result.txt
            images/server/builds/**/smoke.log
            images/server/builds/**/qemu.log
            images/server/builds/**/kernel-manifest
            images/server/builds/**/boot-*.log
            images/server/builds/**/fsck-*.log
            images/server/builds/**/enrollment-*.log
            images/server/builds/**/uefi-*.log
            target/update-test-logs/**/*.log
            images/recovery/builds/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  candidate-handoff:
    name: Development candidate handoff, amd64 media
    needs: installed-boot
    # This validates retained development bytes even if the security gate fails.
    # It never changes the installed-boot result or permits release publication.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: server-candidate-amd64
          path: target/candidate
      - name: Restore exact Server candidate from the producer job
        run: |
          build_id="$(sed -n 's/^BUILD_ID="\([^"]*\)"$/\1/p' system/release/usr/lib/linos/release)"
          bash build/candidate.sh restore target/candidate amd64 "$GITHUB_SHA" "images/server/builds/amd64/$build_id"
      - name: Install media and firmware test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gdisk dosfstools mtools systemd-boot-efi ovmf qemu-system-x86 e2fsprogs
      - name: Build payload and media from the restored candidate without rebuilding Server
        run: |
          bash build/recovery.sh payload amd64
          bash build/media.sh amd64
          bash tests/boot.sh uefi
      - name: Retain candidate handoff evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-handoff-amd64
          path: |
            images/server/builds/**/candidate-manifest
            images/server/builds/**/kernel-manifest
            images/server/builds/**/uefi-*.log
            images/install/payloads/**/manifest
            images/install/payloads/**/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 14
