name: Kernel research (isolated)

# Runs on kernel changes and can be dispatched manually. Research only: no device writes, release publication, or upgrades.
on:
  # Only the main CI workflow may start expensive kernel compilation.
  workflow_call:

permissions:
  contents: read

jobs:
  kernel-qemu:
    name: ${{ matrix.arch }} · signed source, Linos kernel, QEMU boot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qemu_package: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu_package: qemu-system-arm
    steps:
      - name: Checkout Linos
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves cpio busybox-static \
            ${{ matrix.qemu_package }} gnupg git make gcc kmod e2fsprogs \
            mmdebstrap dpkg-dev fakeroot ca-certificates curl expect

      - name: Import and verify pinned kernel.org signer
        shell: bash
        run: |
          set -Eeuo pipefail
          # Pinned fingerprint from https://www.kernel.org/signature.html.
          expected=647F28654894E3BD457199BE38DBBDC86092693E
          # WKD and public keyservers can fail independently. Never relax the
          # pinned fingerprint or signature check when a provider is unavailable.
          if ! gpg --batch --list-keys "$expected" >/dev/null 2>&1; then
            gpg --batch --keyserver hkps://keyserver.ubuntu.com \
              --keyserver-options timeout=15 --recv-keys "$expected" ||
            gpg --batch --locate-keys gregkh@kernel.org ||
            gpg --batch --keyserver hkps://keys.openpgp.org \
              --keyserver-options timeout=15 --recv-keys "$expected"
          fi
          gpg --batch --with-colons --fingerprint "$expected" |
            grep -Fxq "fpr:::::::::$expected:"

      - name: Fetch pinned upstream source with signed tag
        shell: bash
        env:
          RELEASE: '7.3.4'
        run: |
          set -Eeuo pipefail
          # kernel.org can be unreachable from a GitHub-hosted ARM runner.
          # Use the stable maintainer's GitHub mirror as a transport fallback,
          # never as an alternative to verifying the pinned signed tag.
          source kernel/source.conf
          test "$RELEASE" = "$LINOS_KERNEL_STABLE"
          for remote in \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            https://github.com/gregkh/linux.git; do
            rm -rf -- "$RUNNER_TEMP/linux"
            if timeout 120s git -c http.lowSpeedLimit=1024 \
              -c http.lowSpeedTime=30 clone --depth 1 --single-branch \
              --branch "v$RELEASE" "$remote" "$RUNNER_TEMP/linux"; then
              echo "Fetched upstream stable kernel from $remote"
              break
            fi
            echo "Source transport unavailable: $remote" >&2
          done
          test -d "$RUNNER_TEMP/linux/.git" || {
            echo "No upstream Linux source mirror reachable" >&2
            exit 1
          }
          git -C "$RUNNER_TEMP/linux" verify-tag "v$RELEASE"
          test "$(git -C "$RUNNER_TEMP/linux" rev-parse HEAD)" = \
            "$(git -C "$RUNNER_TEMP/linux" rev-list -n 1 "v$RELEASE")"

      - name: Build kernel and matching modules
        shell: bash
        env:
          RELEASE: '7.3.4'
        run: |
          set -Eeuo pipefail
          LINOS_KERNEL_RELEASE="$RELEASE" LINOS_KERNEL_JOBS=4 \
            bash build/kernel.sh build "${{ matrix.arch }}" "$RUNNER_TEMP/linux" "$RUNNER_TEMP/kernel-out"
          (cd "$RUNNER_TEMP/kernel-out/linos-kernel" && sha256sum -c SHA256SUMS)
          grep -Fq 'name=linos' "$RUNNER_TEMP/kernel-out/provenance.txt"
          if grep -Fq 'linos13' "$RUNNER_TEMP/kernel-out/provenance.txt"; then
            echo 'Kernel release must not depend on Linos 13 OS version' >&2
            exit 1
          fi

      - name: Boot minimal initramfs under QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/miniroot"
          mkdir -p "$root"/{bin,dev,proc,sys}
          sudo mknod -m 600 "$root/dev/console" c 5 1
          sudo mknod -m 666 "$root/dev/null" c 1 3
          cp /bin/busybox "$root/bin/busybox"
          ln -s busybox "$root/bin/sh"
          cat > "$root/init" <<'INIT'
          #!/bin/sh
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sysfs /sys
          echo LINOS_KERNEL_BOOT_OK
          /bin/busybox poweroff -f
          INIT
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -o --format=newc --quiet | gzip -9) > "$RUNNER_TEMP/initramfs.cpio.gz"
          if [[ "${{ matrix.arch }}" == amd64 ]]; then
            qemu=(
              qemu-system-x86_64 -machine q35,accel=tcg -cpu qemu64
              -kernel "$RUNNER_TEMP/kernel-out/arch/x86/boot/bzImage"
              -append 'console=ttyS0 rdinit=/init loglevel=4'
            )
          else
            qemu=(
              qemu-system-aarch64 -machine virt -cpu cortex-a76
              -kernel "$RUNNER_TEMP/kernel-out/arch/arm64/boot/Image"
              -append 'console=ttyAMA0 rdinit=/init loglevel=4'
            )
          fi
          timeout --signal=TERM --kill-after=5s 120s \
            "${qemu[@]}" -smp 2 -m 1024 \
            -display none -monitor none -serial stdio -no-reboot -net none \
            -initrd "$RUNNER_TEMP/initramfs.cpio.gz" \
            >"$RUNNER_TEMP/kernel-qemu.log" 2>&1 || status=$?
          grep -Fq LINOS_KERNEL_BOOT_OK "$RUNNER_TEMP/kernel-qemu.log" || {
            tail -n 100 "$RUNNER_TEMP/kernel-qemu.log"
            exit 1
          }
          echo 'PASS: Linos research kernel booted minimal QEMU initramfs'

      - name: Set up Rust for Linos Server package
        run: rustup toolchain install stable --profile minimal

      - name: Install verified Debian 13 archive keys
        shell: bash
        run: |
          set -Eeuo pipefail
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build Linos 13 Server and integrate isolated Linos kernel candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash build/package.sh
          LINOS_KERNEL_BUILD_DIR="$RUNNER_TEMP/kernel-out" LINOS_KERNEL_PRIMARY=1 bash build/image.sh
          build_id="$(awk -F '"' '/^BUILD_ID=/ {print $2}' system/release/usr/lib/linos/release)"
          candidate="$GITHUB_WORKSPACE/images/server/builds/${{ matrix.arch }}/$build_id/linos-kernel"
          test -s "$candidate/kernel"
          test -s "$candidate/disk.ext4"
          test -s "$candidate/rootfs.tar"
          default="$GITHUB_WORKSPACE/images/server/builds/${{ matrix.arch }}/$build_id"
          test "$(readlink -f "$default/boot/kernel")" = "$(readlink -f "$candidate/kernel")"
          test "$(readlink -f "$default/disk.ext4")" = "$(readlink -f "$candidate/disk.ext4")"
          test "$(readlink -f "$default/rootfs.tar")" = "$(readlink -f "$candidate/rootfs.tar")"
          test -s "$default/fallback/boot/kernel"
          test -s "$default/fallback/disk.ext4"
          echo "LINOS_SERVER_KERNEL_DIR=$candidate" >> "$GITHUB_ENV"

      - name: Boot Linos as the normal Server kernel
        shell: bash
        run: |
          bash tests/kernel.sh "$LINOS_SERVER_KERNEL_DIR"
          bash tests/server.sh smoke "${{ matrix.arch }}"

      - name: Install AMD64 UEFI firmware and media tooling
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gdisk dosfstools mtools systemd-boot-efi ovmf

      - name: Firmware-boot Linos research kernel into actual Server
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -Eeuo pipefail
          export LINOS_KERNEL_TEST_IMAGE_DIR="$LINOS_SERVER_KERNEL_DIR"
          bash build/media.sh amd64
          bash tests/boot.sh uefi

      - name: Package tested Linos kernel candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          source kernel/source.conf
          archive="$RUNNER_TEMP/linos-kernel-${LINOS_KERNEL_VERSION}-${{ matrix.arch }}.tar.gz"
          tar -C "$RUNNER_TEMP/kernel-out" -czf "$archive" linos-kernel
          sha256sum "$archive" > "$archive.sha256"
          echo "Kernel candidate: $archive"

      - name: Upload test-passed experimental kernel
        uses: actions/upload-artifact@v7
        with:
          name: linos-kernel-${{ matrix.arch }}-experimental
          path: |
            ${{ runner.temp }}/linos-kernel-*.tar.gz
            ${{ runner.temp }}/linos-kernel-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload evidence (not full kernel outputs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-research-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/kernel-out/provenance.txt
            ${{ runner.temp }}/kernel-out/linos-kernel/SHA256SUMS
            ${{ runner.temp }}/kernel-qemu.log
            images/server/builds/**/linos-kernel/kernel-release
            images/server/builds/**/linos-kernel/architecture
            images/server/builds/**/linos-kernel/server-smoke.log
            images/server/builds/**/linos-kernel/server-qemu.log
            images/server/builds/**/linos-kernel/uefi-smoke.log
            images/server/builds/**/linos-kernel/uefi-qemu.log
          if-no-files-found: ignore
          retention-days: 7
