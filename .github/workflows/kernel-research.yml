name: Kernel research (isolated)

# Runs on kernel changes and can be dispatched manually. Research only: no device writes, release publication, or upgrades.
on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-research.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Pinned upstream release to research
        type: choice
        options:
          - '7.3.4'
          - '6.18.63'
        required: true
        default: '7.3.4'

permissions:
  contents: read

jobs:
  qemu-amd64:
    name: amd64 · signed source, kernel build, QEMU boot
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Linos
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves cpio busybox-static \
            qemu-system-x86 gnupg git make gcc kmod e2fsprogs \
            mmdebstrap dpkg-dev fakeroot ca-certificates curl expect

      - name: Import and verify pinned kernel.org signer
        shell: bash
        run: |
          set -Eeuo pipefail
          # Pinned fingerprint from https://www.kernel.org/signature.html.
          expected=647F28654894E3BD457199BE38DBBDC86092693E
          gpg --batch --locate-keys gregkh@kernel.org || \
            gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$expected"
          gpg --batch --with-colons --fingerprint "$expected" |
            grep -Fxq "fpr:::::::::$expected:"

      - name: Fetch pinned upstream source with signed tag
        shell: bash
        env:
          RELEASE: ${{ inputs.release || '7.3.4' }}
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "v$RELEASE" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "$RUNNER_TEMP/linux"
          git -C "$RUNNER_TEMP/linux" verify-tag "v$RELEASE"
          test "$(git -C "$RUNNER_TEMP/linux" rev-parse HEAD)" = \
            "$(git -C "$RUNNER_TEMP/linux" rev-list -n 1 "v$RELEASE")"

      - name: Build kernel and matching modules
        shell: bash
        env:
          RELEASE: ${{ inputs.release || '7.3.4' }}
        run: |
          set -Eeuo pipefail
          LINOS_KERNEL_RELEASE="$RELEASE" LINOS_KERNEL_JOBS=4 \
            bash kernel/build.sh amd64 "$RUNNER_TEMP/linux" "$RUNNER_TEMP/kernel-out"

      - name: Boot minimal initramfs under QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/miniroot"
          mkdir -p "$root"/{bin,dev,proc,sys}
          sudo mknod -m 600 "$root/dev/console" c 5 1
          sudo mknod -m 666 "$root/dev/null" c 1 3
          cp /bin/busybox "$root/bin/busybox"
          ln -s busybox "$root/bin/sh"
          cat > "$root/init" <<'INIT'
          #!/bin/sh
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sysfs /sys
          echo LINOS_KERNEL_BOOT_OK
          /bin/busybox poweroff -f
          INIT
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -o --format=newc --quiet | gzip -9) > "$RUNNER_TEMP/initramfs.cpio.gz"
          timeout --signal=TERM --kill-after=5s 120s \
            qemu-system-x86_64 -machine q35,accel=tcg -cpu qemu64 -smp 2 -m 1024 \
            -display none -monitor none -serial stdio -no-reboot -net none \
            -kernel "$RUNNER_TEMP/kernel-out/arch/x86/boot/bzImage" \
            -initrd "$RUNNER_TEMP/initramfs.cpio.gz" \
            -append 'console=ttyS0 rdinit=/init loglevel=4' \
            >"$RUNNER_TEMP/kernel-qemu.log" 2>&1 || status=$?
          grep -Fq LINOS_KERNEL_BOOT_OK "$RUNNER_TEMP/kernel-qemu.log" || {
            tail -n 100 "$RUNNER_TEMP/kernel-qemu.log"
            exit 1
          }
          echo 'PASS: Linos research kernel booted minimal QEMU initramfs'

      - name: Set up Rust for Linos Server package
        run: rustup toolchain install stable --profile minimal

      - name: Install verified Debian 13 archive keys
        shell: bash
        run: |
          set -Eeuo pipefail
          keydir="$RUNNER_TEMP/linos-debian-keys"
          mkdir -p "$keydir"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13.asc \
            --output "$keydir/archive.asc"
          curl --fail --location --silent --show-error \
            https://ftp-master.debian.org/keys/archive-key-13-security.asc \
            --output "$keydir/security.asc"
          (
            cd "$keydir"
            printf '%s\n' \
              '6f1d277429dd7ffedcc6f8688a7ad9a458859b1139ffa026d1eeaadcbffb0da7  archive.asc' \
              '844c07d242db37f283afab9d5531270a0550841e90f9f1a9c3bd599722b808b7  security.asc' \
              | sha256sum --check
          )
          gpg --batch --dearmor --output "$keydir/archive.gpg" "$keydir/archive.asc"
          gpg --batch --dearmor --output "$keydir/security.gpg" "$keydir/security.asc"
          cat "$keydir/archive.gpg" "$keydir/security.gpg" > "$keydir/trixie.gpg"
          echo "LINOS_KEYRING=$keydir/trixie.gpg" >> "$GITHUB_ENV"

      - name: Build existing Linos Server rootfs without modifying release outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          bash build/package.sh
          bash build/image.sh
          build_id="$(awk -F '"' '/^BUILD_ID=/ {print $2}' packages/release/usr/lib/linos/release)"
          echo "LINOS_ROOTFS=$GITHUB_WORKSPACE/images/server/builds/amd64/$build_id/rootfs.tar" >> "$GITHUB_ENV"

      - name: Assemble disposable Server with research kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          bash kernel/server-image.sh "$LINOS_ROOTFS" "$RUNNER_TEMP/kernel-out" "$RUNNER_TEMP/server-kernel-test"

      - name: Boot real Linos Server under research kernel
        shell: bash
        run: bash kernel/server-smoke.sh "$RUNNER_TEMP/server-kernel-test"

      - name: Upload evidence (not full kernel outputs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-research-amd64
          path: |
            ${{ runner.temp }}/kernel-out/provenance.txt
            ${{ runner.temp }}/kernel-qemu.log
            ${{ runner.temp }}/server-kernel-test/kernel-release
            ${{ runner.temp }}/server-kernel-test/server-smoke.log
            ${{ runner.temp }}/server-kernel-test/server-qemu.log
          if-no-files-found: ignore
          retention-days: 7
