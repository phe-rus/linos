name: Linos Kernel · Build

# Reusable kernel build only. No QEMU, OS images, or publication.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One workflow, two isolated native runners. Parallelism saves elapsed
      # time without compiling the same architecture twice.
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm explicit kernel release request
        shell: bash
        run: |
          set -Eeuo pipefail
          source kernel/source.conf
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_EVENT_NAME" == push ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Validate Linos kernel contracts with Rust
        run: |
          cargo fmt --manifest-path kernel/tools/Cargo.toml --check
          cargo test --manifest-path kernel/tools/Cargo.toml --locked
          cargo build --release --manifest-path kernel/tools/Cargo.toml --locked
      - name: Install kernel toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev gnupg git make gcc kmod dpkg-dev ca-certificates ccache
      - name: Restore reusable compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linos-kernel-ccache-${{ matrix.arch }}-${{ hashFiles('kernel/source.conf', 'kernel/config/*.config', 'kernel/overlays/**', 'build/kernel.sh') }}
          restore-keys: |
            linos-kernel-ccache-${{ matrix.arch }}-
      - name: Configure compiler cache
        run: |
          ccache --max-size=1500M
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
      - name: Verify official Linux stable signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=647F28654894E3BD457199BE38DBBDC86092693E
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$expected" ||
            gpg --batch --locate-keys gregkh@kernel.org ||
            gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$expected"
          gpg --batch --with-colons --fingerprint "$expected" |
            grep -Fxq "fpr:::::::::$expected:"
      - name: Obtain verified upstream Linux source
        shell: bash
        run: |
          set -Eeuo pipefail
          source kernel/source.conf
          # ARM-hosted runners cannot always reach git.kernel.org. Use the
          # maintainer's GitHub mirror first there; prefer kernel.org on amd64.
          # Both transports must pass verification of the identical signed tag.
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            remotes=(https://github.com/gregkh/linux.git
                     https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git)
          else
            remotes=(https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
                     https://github.com/gregkh/linux.git)
          fi
          for remote in "${remotes[@]}"; do
            rm -rf -- kernel/source/linux
            if timeout 420s git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=120 \
              clone --depth 1 --single-branch --branch "v$LINOS_KERNEL_LTS" \
              "$remote" kernel/source/linux; then
              echo "Obtained signed source candidate via $remote"
              break
            fi
            echo "Source transport failed: $remote" >&2
          done
          test -d kernel/source/linux/.git
          git -C kernel/source/linux verify-tag "v$LINOS_KERNEL_LTS"
          test "$(git -C kernel/source/linux rev-parse HEAD)" = \
            "$(git -C kernel/source/linux rev-list -n 1 "v$LINOS_KERNEL_LTS")"

      - name: Compile and package kernel once
        shell: bash
        run: |
          set -Eeuo pipefail
          source kernel/source.conf
          LINOS_KERNEL_RELEASE="$LINOS_KERNEL_LTS" LINOS_KERNEL_JOBS=4 \
            bash build/kernel.sh build "${{ matrix.arch }}" kernel/source/linux kernel/build/${{ matrix.arch }}
          bash build/kernel-package.sh kernel/build/${{ matrix.arch }}/linos-kernel kernel/dist
          (cd kernel/dist && sha256sum -c SHA256SUMS)
          test "$(dpkg-deb -f kernel/dist/linos-kernel_*.deb Architecture)" = "${{ matrix.arch }}"
          cp "kernel/build/${{ matrix.arch }}/provenance.txt" kernel/dist/provenance.txt
      - name: Show compiler reuse statistics
        if: always()
        run: ccache --show-stats
      - name: Upload kernel package for boot and release stages
        uses: actions/upload-artifact@v7
        with:
          name: linos-kernel-${{ matrix.arch }}
          path: |
            kernel/dist/*.deb
            kernel/dist/SHA256SUMS
            kernel/dist/kernel-release
            kernel/dist/provenance.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed kernel config
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-failure-${{ matrix.arch }}
          path: kernel/build/${{ matrix.arch }}/.config
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
