[package]
name = "infs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
libc = "0.2.191"
rustix = { version = "1.1.5", features = ["process"] }
cliclack = "0.5.7"

[[bin]]
name = "linos"
path = "src/console/main.rs"
[[bin]]
name = "detect"
path = "src/detect/main.rs"
[[bin]]
name = "enroll"
path = "src/enroll/main.rs"
[[bin]]
name = "linos-login"
path = "src/login/main.rs"
[[bin]]
name = "recovery"
path = "src/recovery/main.rs"
